name: Newsboy Auto Poster

on:
  schedule:
    # UTC 時間格式：每 15 分鐘執行一次 (* / 15 * * * *)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊按鈕觸發執行

jobs:
  run-newsboy:
    runs-on: ubuntu-latest

    steps:
    - name: 下載專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行 Newsboy 機器人
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python main.py
